[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  { allow = ["MPL-2.0"], crate = "uniffi@0.32.0" },
  { allow = ["MPL-2.0"], crate = "uniffi_bindgen@0.32.0" },
  { allow = ["MPL-2.0"], crate = "uniffi_core@0.32.0" },
  { allow = ["MPL-2.0"], crate = "uniffi_internal_macros@0.32.0" },
  { allow = ["MPL-2.0"], crate = "uniffi_macros@0.32.0" },
  { allow = ["MPL-2.0"], crate = "uniffi_meta@0.32.0" },
  { allow = ["MPL-2.0"], crate = "uniffi_pipeline@0.32.0" },
  { allow = ["MPL-2.0"], crate = "uniffi_udl@0.32.0" },
]
