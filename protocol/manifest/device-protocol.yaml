layouts:
  DEVICE_STATUS:
    minimumLength: 14
    fields:
      - { name: battery_percent, offset: 0, width: 1, encoding: u8 }
      - { name: lte_status, offset: 1, width: 1, encoding: enum_u8 }
      - { name: device_state, offset: 2, width: 1, encoding: enum_u8 }
      - { name: pending_recordings, offset: 3, width: 1, encoding: u8 }
      - { name: last_time_sync, offset: 4, width: 4, encoding: u32_le }
      - { name: flags, offset: 8, width: 1, encoding: bitmask_u8 }
      - { name: storage_total_mb, offset: 9, width: 2, encoding: u16_le }
      - { name: storage_used_mb, offset: 11, width: 2, encoding: u16_le }
      - { name: lte_signal_quality, offset: 13, width: 1, encoding: u8 }
      - { name: wifi_status, offset: 14, width: 1, encoding: enum_u8, optional: true }
      - { name: battery_mv, offset: 15, width: 2, encoding: u16_le, optional: true }
      - { name: modem_info, offset: 17, width: 0, encoding: utf8_tail, optional: true }
  STORAGE_INFO:
    minimumLength: 12
    fields:
      - { name: total_kb, offset: 0, width: 4, encoding: u32_le }
      - { name: used_kb, offset: 4, width: 4, encoding: u32_le }
      - { name: total_recordings, offset: 8, width: 2, encoding: u16_le }
      - { name: pending_sync_count, offset: 10, width: 2, encoding: u16_le }
  RECORDING_ENTRY:
    minimumLength: 24
    fixedLength: 24
    fields:
      - { name: file_id, offset: 0, width: 4, encoding: bytes }
      - { name: flags, offset: 4, width: 1, encoding: bitmask_u8 }
      - { name: timestamp, offset: 16, width: 4, encoding: u32_le }
      - { name: duration_seconds, offset: 20, width: 2, encoding: u16_le }
      - { name: size_kb, offset: 22, width: 2, encoding: u16_le }
  TRANSFER_PACKET:
    minimumLength: 3
    fields:
      - { name: packet_type, offset: 0, width: 1, encoding: enum_u8 }
      - { name: sequence, offset: 1, width: 2, encoding: u16_le }
      - { name: payload_length_or_checksum, offset: 3, width: 2, encoding: type_specific, optional: true }
      - { name: payload, offset: 5, width: 0, encoding: bytes_tail, optional: true }
  DEVICE_SETTINGS:
    minimumLength: 8
    fixedLength: 12
    fields:
      - { name: version, offset: 0, width: 1, encoding: u8 }
      - { name: enabled_mask, offset: 1, width: 1, encoding: bitmask_u8 }
      - { name: upload_preference, offset: 2, width: 3, encoding: connection_ids }
      - { name: cellular_idle_timeout, offset: 5, width: 1, encoding: timeout_10s }
      - { name: wifi_idle_timeout, offset: 6, width: 1, encoding: timeout_10s }
      - { name: streaming_enabled, offset: 7, width: 1, encoding: bool_u8 }
      - { name: flush_interval_seconds, offset: 8, width: 1, encoding: u8, optional: true }
      - { name: heartbeat_mask, offset: 9, width: 1, encoding: bitmask_u8, optional: true }
  DEVICE_LOG_PACKET:
    minimumLength: 3
    fields:
      - { name: sequence, offset: 0, width: 2, encoding: u16_le }
      - { name: flags, offset: 2, width: 1, encoding: bitmask_u8 }
      - { name: utf8_bytes, offset: 3, width: 0, encoding: bytes_tail }
  FIRMWARE_UPLOAD_START:
    minimumLength: 5
    fixedLength: 5
    fields:
      - { name: command, offset: 0, width: 1, encoding: enum_u8 }
      - { name: file_size, offset: 1, width: 4, encoding: u32_le }
  FIRMWARE_DATA_PACKET:
    minimumLength: 3
    fields:
      - { name: command, offset: 0, width: 1, encoding: enum_u8 }
      - { name: sequence, offset: 1, width: 2, encoding: u16_le }
      - { name: payload, offset: 3, width: 0, encoding: bytes_tail }
  FIRMWARE_UPLOAD_VERIFY:
    minimumLength: 5
    fixedLength: 5
    fields:
      - { name: command, offset: 0, width: 1, encoding: enum_u8 }
      - { name: crc32, offset: 1, width: 4, encoding: u32_le }

limits:
  DEFAULT_MTU: 23
  MAX_MTU: 512
  TRANSFER_WINDOW_SIZE: 4
  FIRMWARE_CHUNK_SIZE: 500
  FIRMWARE_ACK_WINDOW: 8
  SHA256_LENGTH: 32
  E2E_EPHEMERAL_PUBLIC_KEY_LENGTH: 32
  E2E_SALT_LENGTH: 4
  E2E_TAG_LENGTH: 16
