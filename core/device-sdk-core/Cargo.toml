[package]
name = "bota-device-sdk-core"
version = "1.0.2"
edition = "2024"
rust-version = "1.98"
description = "Portable protocol and workflow contracts for Bota wearable devices"
license = "MIT"
repository = "https://github.com/bota-dev/app-sdk"
homepage = "https://github.com/bota-dev/app-sdk"
documentation = "https://docs.rs/bota-device-sdk-core"
readme = "README.md"
keywords = ["bota", "bluetooth", "wearable", "protocol", "sdk"]
categories = ["api-bindings", "embedded", "encoding"]
publish = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.150"
time = { version = "0.3.44", features = ["formatting"] }

[lib]
path = "src/lib.rs"
