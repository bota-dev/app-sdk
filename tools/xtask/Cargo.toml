[package]
name = "xtask"
version = "1.0.0-alpha.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
toml = "1.1.4"

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
