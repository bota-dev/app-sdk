[package]
name = "bota-device-sdk-ffi-smoke"
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[features]
default = []
uniffi-spike = ["dep:thiserror", "dep:uniffi"]

[dependencies]
bota-device-sdk-core = { path = "../../core/device-sdk-core" }
serde_json = "1.0.150"
thiserror = { version = "2.0.18", optional = true }
uniffi = { version = "=0.32.0", default-features = false, optional = true }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"
