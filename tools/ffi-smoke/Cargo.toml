[package]
name = "bota-device-sdk-ffi-smoke"
version = "1.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[features]
default = []
uniffi-spike = [
  "dep:bota-device-sdk-core",
  "dep:serde_json",
  "dep:thiserror",
  "dep:uniffi",
]

[dependencies]
bota-device-sdk-core = { path = "../../core/device-sdk-core", optional = true }
serde_json = { version = "1.0.150", optional = true }
thiserror = { version = "2.0.18", optional = true }
uniffi = { version = "=0.32.0", default-features = false, optional = true }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"
