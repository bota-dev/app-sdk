[package]
name = "bota-device-sdk-wasm"
version = "1.2.0-beta.12"
edition = "2024"
rust-version = "1.98"
description = "Private WebAssembly bridge for the Bota SDK for Web"
license = "MIT"
repository = "https://github.com/bota-dev/app-sdk"
publish = false

[dependencies]
bota-device-sdk-core = { path = "../../core/device-sdk-core", version = "1.2.0-beta.12" }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
sha2 = "0.11.0"
wasm-bindgen = "=0.2.128"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
