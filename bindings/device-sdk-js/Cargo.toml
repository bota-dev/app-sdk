[package]
name = "bota-device-sdk-js"
version = "2.0.0-beta.18"
edition = "2024"
rust-version = "1.98"
description = "Private raw-memory bridge for generated JavaScript Bota App SDK runtimes"
license = "MIT"
repository = "https://github.com/bota-dev/app-sdk"
publish = false

[dependencies]
bota-device-sdk-core = { path = "../../core/device-sdk-core", version = "=2.0.0-beta.18" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
base64 = "0.22.1"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
