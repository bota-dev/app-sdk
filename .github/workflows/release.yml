name: Release Bota App SDK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      releaseRef:
        description: Exact annotated release tag ref, for example refs/tags/v1.1.0
        required: true
        type: string
      centralDeploymentId:
        description: Existing Central Portal deployment UUID
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CLI_VERSION: "12.0.2"

permissions:
  contents: read

concurrency:
  group: central-dev.bota-bota-android-sdk-1.1.0
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Node.js dependencies
        run: npm ci

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test repository tooling
        run: npm run test:tooling

      - name: Check generated protocol constants
        run: cargo xtask protocol generate --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Test shipping native C ABI
        run: tools/ffi-smoke/run-native-c-smoke.sh

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check Cargo advisories and licenses
        run: cargo deny check

  apple:
    name: Package Apple SDK
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run shipping Swift caller
        run: tools/ffi-smoke/run-native-swift-smoke.sh

      - name: Test Apple package and XCFramework
        run: tools/apple/test-package.sh -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test local external Apple consumer
        run: tools/apple/test-consumer.sh

      - name: Compile generic iOS device target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppleSDK \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../target/release-apple-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Compile generic iOS simulator target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppleSDK \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../../target/release-apple-ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Test release tooling
        run: npm run test:release

      - name: Package checksummed Apple release
        run: tools/apple/package-release.sh

      - name: Upload Apple release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-release-${{ github.ref_name }}
          path: target/apple-release/
          if-no-files-found: error
          compression-level: 0

  android:
    name: Package and verify Android SDK
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust Android build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned Android build tools and emulator images
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "emulator" \
            "platform-tools" \
            "system-images;android-26;google_apis;x86" \
            "system-images;android-35;google_apis;x86_64"

      - name: Install repository tooling
        run: npm ci

      - name: Enable Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build and verify deterministic Android release inputs
        run: |
          tools/android/test-publication-graphs.sh
          tools/android/package-release.sh --check
          tools/android/verify-publication.sh target/android-release
          cargo xtask release validate target/android-release/release-manifest.json
          tools/android/install-release-repository.sh target/android-release target/android-m2
          platforms/android/gradlew -p platforms/android \
            :sdk:testDebugUnitTest \
            :sdk:lintRelease \
            :sdk:assembleDebug \
            :sdk:assembleDebugAndroidTest

      - name: Test API 26 release consumers
        run: tools/android/test-emulator-lane.sh --api 26

      - name: Test API 35 release consumers
        run: tools/android/test-emulator-lane.sh --api 35

      - name: Upload unsigned Android publication inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-${{ github.ref_name }}
          path: target/android-release/
          if-no-files-found: error
          compression-level: 0

  react-native:
    name: Package and verify React Native SDK
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install repository tooling
        run: npm ci

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Verify React Native package
        working-directory: frameworks/react-native
        run: npm run verify

      - name: Pack immutable npm artifact
        working-directory: frameworks/react-native
        run: |
          mkdir -p ../../target/react-native-release
          npx --yes "npm@$NPM_CLI_VERSION" pack --pack-destination ../../target/react-native-release

      - name: Upload React Native release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-native-release-${{ github.ref_name }}
          path: target/react-native-release/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish ${{ github.ref_name }}
    if: github.event_name == 'push'
    needs: [verify, apple, android, react-native]
    runs-on: ubuntu-latest
    environment: release
    outputs:
      android-central-published: ${{ steps.central-readiness.outputs.published }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install repository tooling
        run: npm ci

      - name: Download Apple release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-release-${{ github.ref_name }}
          path: target/apple-release/

      - name: Download Android release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-${{ github.ref_name }}
          path: target/android-release/

      - name: Download React Native release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: react-native-release-${{ github.ref_name }}
          path: target/react-native-release/

      - name: Verify annotated tag and candidate inventory
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REVISION="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$SOURCE_REVISION" = "$(git rev-parse HEAD)"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          tools/release/write-candidate-inventory.sh \
            --source-revision "$SOURCE_REVISION" \
            --output target/release-candidate-files.json \
            target/apple-release target/android-release target/react-native-release
          INVENTORY_SHA256="$(sha256sum target/release-candidate-files.json | awk '{print $1}')"
          TAG_MESSAGE="$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")"
          grep -Fx "Source-Revision: $SOURCE_REVISION" <<<"$TAG_MESSAGE"
          grep -Fx "Candidate-Inventory-SHA256: $INVENTORY_SHA256" <<<"$TAG_MESSAGE"

      - name: Stage signed Maven Central repository
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
          platforms/android/gradlew -p platforms/android \
            -PbotaProtectedSigning=true \
            :sdk:stageSignedCentralRawRepository \
            --no-daemon --no-parallel --no-configuration-cache

      - name: Build and verify exact Central bundle
        run: |
          node tools/android/normalize-central-repository.mjs \
            --raw-repository target/android-central-raw \
            --portal-repository target/android-central-portal \
            --coordinate dev.bota:bota-android-sdk \
            --version 1.1.0
          cmp \
            target/android-central-portal/dev/bota/bota-android-sdk/1.1.0/bota-android-sdk-1.1.0.aar \
            target/android-release/bota-android-sdk-1.1.0.aar
          node tools/android/build-central-bundle.mjs build \
            --repository target/android-central-portal \
            --coordinate dev.bota:bota-android-sdk \
            --version 1.1.0 \
            --source-revision "$(git rev-parse HEAD)" \
            --inventory target/android-release/central-bundle-files.json \
            --output target/android-release/central-bundle.zip
          node tools/android/build-central-bundle.mjs verify \
            --repository target/android-central-portal \
            --inventory target/android-release/central-bundle-files.json \
            --zip target/android-release/central-bundle.zip
          node tools/android/central-portal.mjs prepare \
            --repository target/android-central-portal \
            --bundle target/android-release/central-bundle.zip \
            --inventory target/android-release/central-bundle-files.json \
            --state target/central-portal-state.json \
            --source-revision "$(git rev-parse HEAD)"

      - name: Create draft release and preserve immutable publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --generate-notes --title "Bota App SDK ${GITHUB_REF_NAME#v}"
          fi
          mkdir -p target/existing-release-assets
          for path in \
            target/android-release/central-bundle.zip \
            target/android-release/central-bundle-files.json \
            target/release-candidate-files.json
          do
            name="$(basename "$path")"
            if gh release download "$GITHUB_REF_NAME" --pattern "$name" \
              --dir target/existing-release-assets >/dev/null 2>&1
            then
              cmp "$path" "target/existing-release-assets/$name"
            else
              gh release upload "$GITHUB_REF_NAME" "$path"
            fi
          done
          gh release upload "$GITHUB_REF_NAME" target/central-portal-state.json --clobber

      - name: Upload or resume Central deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
          node tools/android/central-portal.mjs upload-or-resume \
            --repository target/android-central-portal \
            --bundle target/android-release/central-bundle.zip \
            --inventory target/android-release/central-bundle-files.json \
            --state target/central-portal-state.json \
            --source-revision "$(git rev-parse HEAD)"

      - name: Verify complete public Maven inventory
        run: |
          node tools/android/central-portal.mjs verify-published \
            --state target/central-portal-state.json \
            --inventory target/android-release/central-bundle-files.json

      - name: Mark Central publication ready
        id: central-readiness
        run: echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish or verify exact npm artifact
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_PATH="$(find target/react-native-release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$PACKAGE_PATH"
          PACKAGE_SPEC="@bota.dev/react-native-sdk@${GITHUB_REF_NAME#v}"
          EXPECTED_SHASUM="$(sha1sum "$PACKAGE_PATH" | awk '{print $1}')"

          if PUBLISHED_SHASUM="$(npx --yes "npm@$NPM_CLI_VERSION" view "$PACKAGE_SPEC" dist.shasum 2>/dev/null)"; then
            test "$PUBLISHED_SHASUM" = "$EXPECTED_SHASUM"
          else
            npx --yes "npm@$NPM_CLI_VERSION" publish "$PACKAGE_PATH" --access public
          fi

          PUBLISHED_SHASUM=""
          for attempt in {1..30}; do
            if PUBLISHED_SHASUM="$(npx --yes "npm@$NPM_CLI_VERSION" view "$PACKAGE_SPEC" dist.shasum 2>/dev/null)"; then
              break
            fi
            sleep 10
          done
          test "$PUBLISHED_SHASUM" = "$EXPECTED_SHASUM"

      - name: Preserve latest Central deployment state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: central-deployment-${{ github.ref_name }}
          path: target/central-portal-state.json
          if-no-files-found: warn

      - name: Update draft release deployment state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f target/central-portal-state.json ]]; then
            gh release upload "$GITHUB_REF_NAME" target/central-portal-state.json --clobber
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" target/apple-release/* target/react-native-release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  recover-central:
    name: Recover Central deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Validate recovery inputs
        run: |
          test "${{ inputs.releaseRef }}" = "refs/tags/v1.1.0"
          [[ "${{ inputs.centralDeploymentId }}" =~ ^[0-9a-fA-F-]{36}$ ]]

      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.releaseRef }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Install repository tooling
        run: npm ci

      - name: Verify immutable tag identity
        run: |
          test "$(git cat-file -t v1.1.0)" = tag
          test "$(git rev-list -n 1 v1.1.0)" = "$(git rev-parse HEAD)"
          cargo xtask release verify-tag v1.1.0

      - name: Download preserved deployment inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/android-release
          gh release download v1.1.0 --pattern central-bundle.zip \
            --dir target/android-release
          gh release download v1.1.0 --pattern central-bundle-files.json \
            --dir target/android-release
          gh release download v1.1.0 --pattern central-portal-state.json \
            --dir target

      - name: Verify preserved source identity
        run: |
          test "$(jq -r .sourceRevision target/central-portal-state.json)" = "$(git rev-parse HEAD)"
          test "$(jq -r .sourceRevision target/android-release/central-bundle-files.json)" = "$(git rev-parse HEAD)"

      - name: Recover and resume exact deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          node tools/android/central-portal.mjs recover-and-resume \
            --release-ref "${{ inputs.releaseRef }}" \
            --deployment-id "${{ inputs.centralDeploymentId }}" \
            --bundle target/android-release/central-bundle.zip \
            --inventory target/android-release/central-bundle-files.json \
            --state target/central-portal-state.json
          node tools/android/central-portal.mjs verify-published \
            --state target/central-portal-state.json \
            --inventory target/android-release/central-bundle-files.json

      - name: Preserve recovered deployment state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: central-deployment-v1.1.0-recovery
          path: target/central-portal-state.json
          if-no-files-found: warn

      - name: Update release deployment state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f target/central-portal-state.json ]]; then
            gh release upload v1.1.0 target/central-portal-state.json --clobber
          fi

  smoke-public-package:
    name: Smoke public Apple package
    if: github.event_name == 'push'
    needs: publish
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and compile public package consumer
        run: tools/apple/test-remote-consumer.sh "${GITHUB_REF_NAME#v}"

  smoke-public-android:
    name: Smoke public Android package on API ${{ matrix.api }}
    if: github.event_name == 'push' && needs.publish.outputs.android-central-published == 'true'
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install public-smoke emulator image
        run: |
          if [[ "${{ matrix.api }}" == "26" ]]; then
            image="system-images;android-26;google_apis;x86"
          else
            image="system-images;android-35;google_apis;x86_64"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "emulator" "platform-tools" "$image"

      - name: Enable Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Resolve and run public Maven consumer
        run: tools/android/test-public-consumer.sh --api ${{ matrix.api }}
