name: Release Device SDK Core

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CRATE_NAME: bota-device-sdk-core

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check generated protocol constants
        run: cargo xtask protocol generate --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check Cargo advisories and licenses
        run: cargo deny check

      - name: Package crate
        run: cargo package --locked --package "$CRATE_NAME"

      - name: Verify publish payload
        run: cargo publish --locked --package "$CRATE_NAME" --dry-run

      - name: Generate checksummed release manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate="target/package/${CRATE_NAME}-${version}.crate"
          output="release-output/${version}.json"
          mkdir -p release-output
          cp "$crate" release-output/
          checksum="$(sha256sum "$crate" | cut -d ' ' -f 1)"
          jq \
            --arg sourceRevision "$GITHUB_SHA" \
            --arg checksum "$checksum" \
            '.sourceRevision = $sourceRevision | .artifacts[0].checksumSha256 = $checksum' \
            "release/examples/${version}.json" > "$output"
          cargo xtask release validate "$output"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"
          version="${GITHUB_REF_NAME#v}"
          if cargo info "${CRATE_NAME}@${version}" >/dev/null 2>&1; then
            echo "${CRATE_NAME}@${version} is already published"
          else
            cargo publish --locked --package "$CRATE_NAME"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-output/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-output/* \
              --verify-tag \
              --generate-notes \
              --title "Bota Device SDK ${GITHUB_REF_NAME#v}"
          fi
