name: Release Bota App SDK

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Node.js dependencies
        run: npm ci

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test repository tooling
        run: npm run test:tooling

      - name: Check generated protocol constants
        run: cargo xtask protocol generate --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Test shipping native C ABI
        run: tools/ffi-smoke/run-native-c-smoke.sh

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check Cargo advisories and licenses
        run: cargo deny check

  apple:
    name: Package Apple SDK
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run shipping Swift caller
        run: tools/ffi-smoke/run-native-swift-smoke.sh

      - name: Test Apple package and XCFramework
        run: tools/apple/test-package.sh -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test local external Apple consumer
        run: tools/apple/test-consumer.sh

      - name: Compile generic iOS device target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppleSDK \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../target/release-apple-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Compile generic iOS simulator target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppleSDK \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../../target/release-apple-ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Test release tooling
        run: npm run test:release

      - name: Package checksummed Apple release
        run: tools/apple/package-release.sh

      - name: Upload Apple release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-release-${{ github.ref_name }}
          path: target/apple-release/
          if-no-files-found: error
          compression-level: 0

  android:
    name: Package and verify Android SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out pinned legacy Android SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bota-dev/bota-mobile-sdk-android
          ref: 0f06d2a22c55e4976778520cce42230d23ca4226
          path: target/legacy-android-sdk

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust Android build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned Android build tools and emulator images
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "emulator" \
            "platform-tools" \
            "system-images;android-26;google_apis;x86" \
            "system-images;android-35;google_apis;x86_64"

      - name: Install repository tooling
        run: npm ci

      - name: Enable Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build and verify deterministic Android release inputs
        run: |
          tools/android/test-publication-graphs.sh
          tools/android/package-release.sh --check
          tools/android/verify-publication.sh target/android-release
          cargo xtask release validate target/android-release/release-manifest.json
          tools/android/install-release-repository.sh target/android-release target/android-m2
          platforms/android/gradlew -p platforms/android \
            :sdk:testDebugUnitTest \
            :sdk:lintRelease \
            :sdk:assembleDebug \
            :sdk:assembleDebugAndroidTest

      - name: Test API 26 release consumers
        run: tools/android/test-emulator-lane.sh --api 26 --legacy-path target/legacy-android-sdk

      - name: Test API 35 release consumers
        run: tools/android/test-emulator-lane.sh --api 35 --legacy-path target/legacy-android-sdk

      - name: Upload unsigned Android publication inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-${{ github.ref_name }}
          path: target/android-release/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish ${{ github.ref_name }}
    needs: [verify, apple, android]
    runs-on: ubuntu-latest
    environment: release
    outputs:
      android-central-published: ${{ steps.central-readiness.outputs.published }}
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Apple release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-release-${{ github.ref_name }}
          path: target/apple-release/

      - name: Download Android release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-${{ github.ref_name }}
          path: target/android-release/

      - name: Keep Maven Central publication disabled pending physical evidence
        id: central-readiness
        run: echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" target/apple-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" target/apple-release/* \
              --verify-tag \
              --generate-notes \
              --title "Bota App SDK ${GITHUB_REF_NAME#v}"
          fi

  smoke-public-package:
    name: Smoke public Apple package
    needs: publish
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and compile public package consumer
        run: tools/apple/test-remote-consumer.sh "${GITHUB_REF_NAME#v}"

  smoke-public-android:
    name: Smoke public Android package on API ${{ matrix.api }}
    if: needs.publish.outputs.android-central-published == 'true'
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install public-smoke emulator image
        run: |
          if [[ "${{ matrix.api }}" == "26" ]]; then
            image="system-images;android-26;google_apis;x86"
          else
            image="system-images;android-35;google_apis;x86_64"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "emulator" "platform-tools" "$image"

      - name: Enable Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Resolve and run public Maven consumer
        run: tools/android/test-public-consumer.sh --api ${{ matrix.api }}
