name: Release Bota App SDK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      releaseRef:
        description: Exact annotated release tag ref, for example refs/tags/v1.2.0-beta.12
        required: true
        type: string
      centralDeploymentId:
        description: Existing Central Portal deployment UUID
        required: true
        type: string
      centralRecoveryMode:
        description: Resume an uncertain deployment or replace a confirmed failed deployment
        required: true
        default: resume-uncertain
        type: choice
        options:
          - resume-uncertain
          - retry-failed
      releaseRunId:
        description: Original tag workflow run containing the immutable release artifacts
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CLI_VERSION: "12.0.2"

permissions:
  contents: read

concurrency:
  group: app-sdk-release-${{ github.event_name == 'push' && github.ref_name || inputs.releaseRef }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out maintenance React Native workflow baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bota-dev/react-native-sdk
          ref: e11fde5be40027ec6cf1985fc0eadb00ece23e65
          path: .ci/react-native-workflow-baseline

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .ci/react-native-workflow-baseline/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install maintenance React Native workflow dependencies
        working-directory: .ci/react-native-workflow-baseline
        run: npm ci

      - name: Resolve beta release channel
        run: |
          node tools/release/resolve-release-channel.mjs \
            --ref "$GITHUB_REF" \
            --mode new

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test repository tooling
        run: npm run test:tooling

      - name: Verify cross-SDK workflow evidence
        run: npm run test:workflows -- --sdk-path .ci/react-native-workflow-baseline

      - name: Check generated protocol constants
        run: cargo xtask protocol generate --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Test shipping native C ABI
        run: tools/ffi-smoke/run-native-c-smoke.sh

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check Cargo advisories and licenses
        run: cargo deny check

  apple:
    name: Package Apple SDK
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run shipping Swift caller
        run: tools/ffi-smoke/run-native-swift-smoke.sh

      - name: Test Apple package and XCFramework
        run: tools/apple/test-package.sh -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test local external Apple consumer
        run: tools/apple/test-consumer.sh

      - name: Compile generic iOS device target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppSDK \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../target/release-apple-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Compile generic iOS simulator target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppSDK \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../../target/release-apple-ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Test release tooling
        run: npm run test:release

      - name: Package checksummed Apple release
        run: tools/apple/package-release.sh

      - name: Lint exact CocoaPods archive
        run: |
          gem install --no-document cocoapods -v 1.16.2
          tools/apple/test-pod-archive.sh

      - name: Upload Apple release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-release-${{ github.ref_name }}
          path: target/apple-release/
          if-no-files-found: error
          compression-level: 0

  android:
    name: Package and verify Android SDK
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust Android build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned Android build tools and emulator images
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "emulator" \
            "platform-tools" \
            "system-images;android-26;google_apis;x86" \
            "system-images;android-35;google_apis;x86_64"

      - name: Install repository tooling
        run: npm ci

      - name: Enable Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Verify synchronized release metadata
        run: cargo xtask release verify-tag "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build and verify deterministic Android release inputs
        timeout-minutes: 15
        run: |
          tools/android/test-publication-graphs.sh
          tools/android/package-release.sh --check
          tools/android/verify-publication.sh target/android-release
          cargo xtask release validate target/android-release/release-manifest.json
          tools/android/install-release-repository.sh target/android-release target/android-m2
          platforms/android/gradlew -p platforms/android \
            :sdk:lintRelease \
            :sdk:assembleDebug \
            :sdk:assembleDebugAndroidTest
          platforms/android/gradlew -p platforms/android :sdk:testDebugUnitTest
          tools/android/test-legacy-consumer.sh --mode source --compile-only \
            --repository target/android-m2
          tools/android/test-legacy-consumer.sh --mode binary --compile-only \
            --repository target/android-m2
          tools/android/test-consumer.sh --compile-only \
            --repository target/android-m2

      - name: Test API 26 release consumers
        run: tools/android/test-emulator-lane.sh --api 26

      - name: Test API 35 release consumers
        run: tools/android/test-emulator-lane.sh --api 35

      - name: Upload unsigned Android publication inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ github.ref_name }}
          path: target/android-release/
          if-no-files-found: error
          compression-level: 0

  react-native:
    name: Package and verify React Native SDK
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install repository tooling
        run: npm ci

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Verify React Native package
        working-directory: frameworks/react-native
        run: npm run verify

      - name: Pack immutable npm artifact
        working-directory: frameworks/react-native
        run: |
          mkdir -p ../../target/react-native-release
          npx --yes "npm@$NPM_CLI_VERSION" pack --pack-destination ../../target/react-native-release

      - name: Upload React Native release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-native-release-${{ github.ref_name }}
          path: target/react-native-release/
          if-no-files-found: error
          compression-level: 0

  web:
    name: Package and verify Web SDK
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/playwright-browsers
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Rust WebAssembly target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Install Web gate dependencies and pinned Chromium browser
        run: |
          npx --yes "npm@$NPM_CLI_VERSION" ci
          npx --yes "npm@$NPM_CLI_VERSION" ci --prefix tests/consumers/web-vite
          tests/consumers/web-vite/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify and pack exact Web SDK artifact
        run: |
          npm run web:verify
          test "$(jq -r .sourceRevision target/web-release/web-package-files.json)" = "$GITHUB_SHA"

      - name: Upload Web release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-release-${{ github.ref_name }}
          path: target/web-release/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish ${{ github.ref_name }}
    if: github.event_name == 'push'
    needs: [verify, apple, android, react-native, web]
    runs-on: ubuntu-latest
    environment: release
    outputs:
      android-central-published: ${{ steps.central-readiness.outputs.published }}
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install repository tooling
        run: npm ci

      - name: Resolve publication channel
        id: release-channel
        run: |
          node tools/release/resolve-release-channel.mjs \
            --ref "$GITHUB_REF" \
            --mode new \
            --github-output "$GITHUB_OUTPUT"

      - name: Export publication metadata
        run: |
          {
            echo "RELEASE_TAG=$GITHUB_REF_NAME"
            echo "RELEASE_VERSION=${{ steps.release-channel.outputs.version }}"
            echo "NPM_DIST_TAG=${{ steps.release-channel.outputs.npm_tag }}"
            echo "GITHUB_PRERELEASE=${{ steps.release-channel.outputs.github_prerelease }}"
          } >> "$GITHUB_ENV"
          test "${{ steps.release-channel.outputs.version }}" = "${GITHUB_REF_NAME#v}"
          ANDROID_COORDINATE="$(node tools/release/package-identities.mjs android '${{ steps.release-channel.outputs.version }}')"
          echo "ANDROID_COORDINATE=$ANDROID_COORDINATE" >> "$GITHUB_ENV"
          echo "ANDROID_ARTIFACT=${ANDROID_COORDINATE#*:}" >> "$GITHUB_ENV"
          test "${{ steps.release-channel.outputs.npm_tag }}" = beta
          test "${{ steps.release-channel.outputs.github_prerelease }}" = true

      - name: Download Apple release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apple-release-${{ github.ref_name }}
          path: target/apple-release/

      - name: Download Android release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-${{ github.ref_name }}
          path: target/android-release/

      - name: Download React Native release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: react-native-release-${{ github.ref_name }}
          path: target/react-native-release/

      - name: Download Web release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-release-${{ github.ref_name }}
          path: target/web-release/

      - name: Verify annotated tag and candidate inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REVISION="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$SOURCE_REVISION" = "$(git rev-parse HEAD)"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          CI_RUN_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_REVISION&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$CI_RUN_ID"
          mkdir -p target/ci-candidate
          gh run download "$CI_RUN_ID" \
            --name "release-candidate-$SOURCE_REVISION" \
            --dir target/ci-candidate
          INVENTORY_SHA256="$(awk '{print $1}' \
            target/ci-candidate/release-candidate-files.json.sha256)"
          [[ "$INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$INVENTORY_SHA256" \
            target/ci-candidate/release-candidate-files.json | sha256sum -c -
          test "$(jq -r .sourceRevision \
            target/ci-candidate/release-candidate-files.json)" = "$SOURCE_REVISION"

          tools/release/write-candidate-inventory.sh \
            --source-revision "$SOURCE_REVISION" \
            --output target/current-native-candidate-files.json \
            target/apple-release target/android-release target/react-native-release \
            target/web-release
          EXPECTED_NATIVE="$(jq -S -c \
            '{schemaVersion, sourceRevision, files: [.files[] | select(.path | startswith("flutter-release/") | not)]}' \
            target/ci-candidate/release-candidate-files.json)"
          CURRENT_NATIVE="$(jq -S -c . target/current-native-candidate-files.json)"
          test "$CURRENT_NATIVE" = "$EXPECTED_NATIVE"
          cp target/ci-candidate/release-candidate-files.json \
            target/release-candidate-files.json
          TAG_MESSAGE="$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")"
          grep -Fx "Source-Revision: $SOURCE_REVISION" <<<"$TAG_MESSAGE"
          grep -Fx "Candidate-Inventory-SHA256: $INVENTORY_SHA256" <<<"$TAG_MESSAGE"

      - name: Restore and verify preserved Central publication inputs
        id: central-archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'preserved=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t ASSETS < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          expected=(central-bundle.zip central-bundle-files.json central-portal-state.json release-candidate-files.json)
          present=0
          for name in "${expected[@]}"; do
            if printf '%s\n' "${ASSETS[@]}" | grep -Fxq "$name"; then
              ((present += 1))
            fi
          done
          if ((present == 0)); then
            echo 'preserved=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$present" -eq "${#expected[@]}" || { echo 'incomplete preserved Central inputs' >&2; exit 1; }
          mkdir -p target/preserved-central
          for name in "${expected[@]}"; do
            gh release download "$RELEASE_TAG" --pattern "$name" --dir target/preserved-central
          done
          cmp target/release-candidate-files.json target/preserved-central/release-candidate-files.json
          node tools/android/central-portal.mjs verify-archived \
            --bundle target/preserved-central/central-bundle.zip \
            --inventory target/preserved-central/central-bundle-files.json \
            --state target/preserved-central/central-portal-state.json \
            --source-revision "$(git rev-parse HEAD)"
          cp target/preserved-central/central-bundle.zip target/android-release/central-bundle.zip
          cp target/preserved-central/central-bundle-files.json target/android-release/central-bundle-files.json
          cp target/preserved-central/central-portal-state.json target/central-portal-state.json
          mkdir -p target/android-central-portal
          unzip -q target/android-release/central-bundle.zip -d target/android-central-portal
          node tools/android/build-central-bundle.mjs verify \
            --repository target/android-central-portal \
            --inventory target/android-release/central-bundle-files.json \
            --zip target/android-release/central-bundle.zip
          cmp \
            "target/android-central-portal/dev/bota/${ANDROID_ARTIFACT}/$RELEASE_VERSION/${ANDROID_ARTIFACT}-$RELEASE_VERSION.aar" \
            "target/android-release/${ANDROID_ARTIFACT}-$RELEASE_VERSION.aar"
          echo 'preserved=true' >> "$GITHUB_OUTPUT"

      - name: Stage signed Maven Central repository
        if: steps.central-archive.outputs.preserved != 'true'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
          platforms/android/gradlew -p platforms/android \
            -PbotaProtectedSigning=true \
            :sdk:stageSignedCentralRawRepository \
            --no-daemon --no-parallel --no-configuration-cache

      - name: Build and verify exact Central bundle
        if: steps.central-archive.outputs.preserved != 'true'
        run: |
          node tools/android/normalize-central-repository.mjs \
            --raw-repository target/android-central-raw \
            --portal-repository target/android-central-portal \
            --coordinate "$ANDROID_COORDINATE" \
            --version "$RELEASE_VERSION"
          cmp \
            "target/android-central-portal/dev/bota/${ANDROID_ARTIFACT}/$RELEASE_VERSION/${ANDROID_ARTIFACT}-$RELEASE_VERSION.aar" \
            "target/android-release/${ANDROID_ARTIFACT}-$RELEASE_VERSION.aar"
          node tools/android/build-central-bundle.mjs build \
            --repository target/android-central-portal \
            --coordinate "$ANDROID_COORDINATE" \
            --version "$RELEASE_VERSION" \
            --source-revision "$(git rev-parse HEAD)" \
            --inventory target/android-release/central-bundle-files.json \
            --output target/android-release/central-bundle.zip
          node tools/android/build-central-bundle.mjs verify \
            --repository target/android-central-portal \
            --inventory target/android-release/central-bundle-files.json \
            --zip target/android-release/central-bundle.zip
          node tools/android/central-portal.mjs prepare \
            --repository target/android-central-portal \
            --bundle target/android-release/central-bundle.zip \
            --inventory target/android-release/central-bundle-files.json \
            --state target/central-portal-state.json \
            --source-revision "$(git rev-parse HEAD)"

      - name: Create draft release and preserve immutable publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --prerelease --verify-tag \
              --generate-notes --title "Bota App SDK $RELEASE_VERSION"
          fi
          mkdir -p target/existing-release-assets
          for path in \
            target/android-release/central-bundle.zip \
            target/android-release/central-bundle-files.json \
            target/release-candidate-files.json
          do
            name="$(basename "$path")"
            if gh release download "$RELEASE_TAG" --pattern "$name" \
              --dir target/existing-release-assets >/dev/null 2>&1
            then
              cmp "$path" "target/existing-release-assets/$name"
            else
              gh release upload "$RELEASE_TAG" "$path"
            fi
          done
          gh release upload "$RELEASE_TAG" target/central-portal-state.json --clobber

      - name: Upload or resume Central deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
          node tools/android/central-portal.mjs upload-or-resume \
            --repository target/android-central-portal \
            --bundle target/android-release/central-bundle.zip \
            --inventory target/android-release/central-bundle-files.json \
            --state target/central-portal-state.json \
            --source-revision "$(git rev-parse HEAD)"

      - name: Verify complete public Maven inventory
        run: |
          node tools/android/central-portal.mjs verify-published \
            --state target/central-portal-state.json \
            --inventory target/android-release/central-bundle-files.json

      - name: Mark Central publication ready
        id: central-readiness
        run: echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Open native bootstrap prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" target/apple-release/* target/react-native-release/* target/web-release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          APPLE_BINARY=target/apple-release/BotaDeviceSDKCore.xcframework.zip
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/BotaDeviceSDKCore.xcframework.zip" \
            --output target/public-apple-binary.zip
          cmp "$APPLE_BINARY" target/public-apple-binary.zip

      - name: Publish or verify exact npm artifact
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_PATH="$(find target/react-native-release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$PACKAGE_PATH"
          node tools/release/publish-npm.mjs react-native "$RELEASE_VERSION" "$PACKAGE_PATH"

      - name: Publish or verify exact Web npm artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t WEB_PACKAGES < <(find target/web-release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#WEB_PACKAGES[@]}" = 1
          PACKAGE_PATH="${WEB_PACKAGES[0]}"
          (cd target/web-release && sha256sum -c web-package-files.json.sha256)
          node tools/web/verify-package.mjs "$PACKAGE_PATH" --sdk-version "$RELEASE_VERSION"
          test "$(jq -r .sourceRevision target/web-release/web-package-files.json)" = "$(git rev-parse HEAD)"
          test "$(jq -r .tarball.sha256 target/web-release/web-package-files.json)" = "$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"
          node tools/release/publish-npm.mjs web "$RELEASE_VERSION" "$PACKAGE_PATH"

      - name: Preserve latest Central deployment state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-deployment-${{ github.ref_name }}
          path: target/central-portal-state.json
          if-no-files-found: warn

      - name: Update draft release deployment state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f target/central-portal-state.json ]]; then
            gh release upload "$RELEASE_TAG" target/central-portal-state.json --clobber
          fi

  publish-apple-pod:
    name: Publish Apple CocoaPod bootstrap
    if: github.event_name == 'push'
    needs: publish
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/publish-apple-pod.yml
    secrets: inherit

  recover-central:
    name: Recover Central deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Validate recovery inputs
        env:
          CENTRAL_DEPLOYMENT_ID_INPUT: ${{ inputs.centralDeploymentId }}
          CENTRAL_RECOVERY_MODE_INPUT: ${{ inputs.centralRecoveryMode }}
          RELEASE_REF_INPUT: ${{ inputs.releaseRef }}
          RELEASE_RUN_ID_INPUT: ${{ inputs.releaseRunId }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_REF_INPUT" =~ ^refs/tags/v[^/]+$ ]]
          [[ "$CENTRAL_DEPLOYMENT_ID_INPUT" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$CENTRAL_RECOVERY_MODE_INPUT" =~ ^(resume-uncertain|retry-failed)$ ]]
          [[ "$RELEASE_RUN_ID_INPUT" =~ ^[0-9]+$ ]]

      - name: Check out protected recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Install repository tooling
        run: npm ci

      - name: Resolve recovery channel
        id: release-channel
        env:
          RELEASE_REF_INPUT: ${{ inputs.releaseRef }}
        run: |
          node tools/release/resolve-release-channel.mjs \
            --ref "$RELEASE_REF_INPUT" \
            --mode recovery \
            --github-output "$GITHUB_OUTPUT"

      - name: Export recovery metadata
        env:
          RELEASE_REF_INPUT: ${{ inputs.releaseRef }}
        run: |
          RELEASE_REF="$RELEASE_REF_INPUT"
          RELEASE_TAG="${RELEASE_REF#refs/tags/}"
          {
            echo "RELEASE_REF=$RELEASE_REF"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_VERSION=${{ steps.release-channel.outputs.version }}"
            echo "NPM_DIST_TAG=${{ steps.release-channel.outputs.npm_tag }}"
            echo "GITHUB_PRERELEASE=${{ steps.release-channel.outputs.github_prerelease }}"
          } >> "$GITHUB_ENV"
          ANDROID_COORDINATE="$(node tools/release/package-identities.mjs android '${{ steps.release-channel.outputs.version }}')"
          echo "ANDROID_COORDINATE=$ANDROID_COORDINATE" >> "$GITHUB_ENV"
          echo "ANDROID_ARTIFACT=${ANDROID_COORDINATE#*:}" >> "$GITHUB_ENV"
          test "${{ steps.release-channel.outputs.npm_tag }}" = beta
          test "${{ steps.release-channel.outputs.github_prerelease }}" = true

      - name: Verify immutable tag identity
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          SOURCE_REVISION="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$SOURCE_REVISION" HEAD
          cargo build -p xtask
          mkdir -p target/recovery-tag-source
          git archive "$RELEASE_TAG" | tar -x -C target/recovery-tag-source
          (
            cd target/recovery-tag-source
            ../debug/xtask release verify-tag "$RELEASE_TAG"
          )
          echo "SOURCE_REVISION=$SOURCE_REVISION" >> "$GITHUB_ENV"

      - name: Download preserved deployment inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/android-release
          gh release download "$RELEASE_TAG" --pattern central-bundle.zip \
            --dir target/android-release
          gh release download "$RELEASE_TAG" --pattern central-bundle-files.json \
            --dir target/android-release
          gh release download "$RELEASE_TAG" --pattern release-candidate-files.json \
            --dir target
          gh release download "$RELEASE_TAG" --pattern central-portal-state.json \
            --dir target

      - name: Download preserved Apple release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apple-release-v${{ steps.release-channel.outputs.version }}
          path: target/recovered/apple-release/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.releaseRunId }}

      - name: Download preserved Android release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-v${{ steps.release-channel.outputs.version }}
          path: target/recovered/android-release/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.releaseRunId }}

      - name: Download preserved React Native release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: react-native-release-v${{ steps.release-channel.outputs.version }}
          path: target/recovered/react-native-release/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.releaseRunId }}

      - name: Download preserved Web release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-release-v${{ steps.release-channel.outputs.version }}
          path: target/recovered/web-release/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.releaseRunId }}

      - name: Verify preserved source identity
        run: |
          test "$(jq -r .sourceRevision target/central-portal-state.json)" = "$SOURCE_REVISION"
          test "$(jq -r .sourceRevision target/android-release/central-bundle-files.json)" = "$SOURCE_REVISION"
          tools/release/write-candidate-inventory.sh \
            --source-revision "$SOURCE_REVISION" \
            --output target/recovered-release-candidate-files.json \
            target/recovered/apple-release \
            target/recovered/android-release \
            target/recovered/react-native-release \
            target/recovered/web-release
          EXPECTED_NATIVE="$(jq -S -c \
            '{schemaVersion, sourceRevision, files: [.files[] | select(.path | startswith("flutter-release/") | not)]}' \
            target/release-candidate-files.json)"
          RECOVERED_NATIVE="$(jq -S -c . target/recovered-release-candidate-files.json)"
          test "$RECOVERED_NATIVE" = "$EXPECTED_NATIVE"
          INVENTORY_SHA256="$(sha256sum target/release-candidate-files.json | awk '{print $1}')"
          TAG_MESSAGE="$(git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG")"
          grep -Fx "Source-Revision: $SOURCE_REVISION" <<<"$TAG_MESSAGE"
          grep -Fx "Candidate-Inventory-SHA256: $INVENTORY_SHA256" <<<"$TAG_MESSAGE"

      - name: Prepare preserved bundle for failed-deployment retry
        if: inputs.centralRecoveryMode == 'retry-failed'
        run: |
          mkdir -p target/android-central-portal
          unzip -q target/android-release/central-bundle.zip -d target/android-central-portal
          node tools/android/central-portal.mjs prepare \
            --repository target/android-central-portal \
            --bundle target/android-release/central-bundle.zip \
            --inventory target/android-release/central-bundle-files.json \
            --state target/central-portal-state.json \
            --source-revision "$SOURCE_REVISION"

      - name: Recover and resume exact deployment
        env:
          CENTRAL_DEPLOYMENT_ID_INPUT: ${{ inputs.centralDeploymentId }}
          CENTRAL_RECOVERY_MODE_INPUT: ${{ inputs.centralRecoveryMode }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          RELEASE_REF_INPUT: ${{ inputs.releaseRef }}
        run: |
          if [[ "$CENTRAL_RECOVERY_MODE_INPUT" = retry-failed ]]; then
            node tools/android/central-portal.mjs retry-failed \
              --release-ref "$RELEASE_REF_INPUT" \
              --failed-deployment-id "$CENTRAL_DEPLOYMENT_ID_INPUT" \
              --bundle target/android-release/central-bundle.zip \
              --inventory target/android-release/central-bundle-files.json \
              --state target/central-portal-state.json
          else
            node tools/android/central-portal.mjs recover-and-resume \
              --release-ref "$RELEASE_REF_INPUT" \
              --deployment-id "$CENTRAL_DEPLOYMENT_ID_INPUT" \
              --bundle target/android-release/central-bundle.zip \
              --inventory target/android-release/central-bundle-files.json \
              --state target/central-portal-state.json
          fi
          node tools/android/central-portal.mjs verify-published \
            --state target/central-portal-state.json \
            --inventory target/android-release/central-bundle-files.json

      - name: Preserve recovered deployment state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-deployment-v${{ steps.release-channel.outputs.version }}-recovery
          path: target/central-portal-state.json
          if-no-files-found: warn

      - name: Update release deployment state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f target/central-portal-state.json ]]; then
            gh release upload "$RELEASE_TAG" target/central-portal-state.json --clobber
          fi

      - name: Publish recovered GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            target/recovered/apple-release/* \
            target/recovered/react-native-release/* \
            target/recovered/web-release/* \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          APPLE_BINARY=target/recovered/apple-release/BotaDeviceSDKCore.xcframework.zip
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/BotaDeviceSDKCore.xcframework.zip" \
            --output target/public-apple-binary.zip
          cmp "$APPLE_BINARY" target/public-apple-binary.zip

      - name: Publish or verify exact npm artifact after recovery
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_PATH="$(find target/recovered/react-native-release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$PACKAGE_PATH"
          node tools/release/publish-npm.mjs react-native "$RELEASE_VERSION" "$PACKAGE_PATH"

      - name: Publish or verify exact Web npm artifact after recovery
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t WEB_PACKAGES < <(find target/recovered/web-release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#WEB_PACKAGES[@]}" = 1
          PACKAGE_PATH="${WEB_PACKAGES[0]}"
          (cd target/recovered/web-release && sha256sum -c web-package-files.json.sha256)
          test "$(jq -r .sourceRevision target/recovered/web-release/web-package-files.json)" = "$SOURCE_REVISION"
          test "$(jq -r .tarball.sha256 target/recovered/web-release/web-package-files.json)" = "$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"
          node tools/web/verify-package.mjs "$PACKAGE_PATH" --sdk-version "$RELEASE_VERSION"
          node tools/release/publish-npm.mjs web "$RELEASE_VERSION" "$PACKAGE_PATH"

  smoke-public-package:
    name: Smoke public Apple package
    if: >-
      ${{
        always() &&
        ((github.event_name == 'push' && needs.publish.result == 'success') ||
         (github.event_name == 'workflow_dispatch' && needs.recover-central.result == 'success'))
      }}
    needs: [publish, recover-central]
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseRef || github.ref }}

      - name: Resolve and compile public package consumer
        env:
          RELEASE_REF_INPUT: ${{ inputs.releaseRef }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            RELEASE_REF="$RELEASE_REF_INPUT"
            VERSION="${RELEASE_REF#refs/tags/v}"
          fi
          tools/apple/test-remote-consumer.sh "$VERSION"

  smoke-public-android:
    name: Smoke public Android package on API ${{ matrix.api }}
    if: >-
      ${{
        always() &&
        ((github.event_name == 'push' && needs.publish.result == 'success') ||
         (github.event_name == 'workflow_dispatch' && needs.recover-central.result == 'success'))
      }}
    needs: [publish, recover-central]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseRef || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install public-smoke emulator image
        run: |
          if [[ "${{ matrix.api }}" == "26" ]]; then
            image="system-images;android-26;google_apis;x86"
          else
            image="system-images;android-35;google_apis;x86_64"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "emulator" "platform-tools" "$image"

      - name: Enable Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Resolve and run public Maven consumer
        run: tools/android/test-public-consumer.sh --api ${{ matrix.api }}

  flutter:
    name: Build Flutter release candidate
    if: >-
      ${{ always() && github.event_name == 'push' &&
          needs.publish.result == 'success' &&
          needs.publish-apple-pod.result == 'success' &&
          needs.smoke-public-package.result == 'success' &&
          needs.smoke-public-android.result == 'success' }}
    needs: [publish, publish-apple-pod, smoke-public-package, smoke-public-android]
    runs-on: macos-15
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust native targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned Android tooling
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install isolated CocoaPods toolchain
        run: tools/flutter/install-pinned-cocoapods.sh

      - name: Install repository tooling
        run: npm ci

      - name: Download tagged candidate inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/tagged-candidate
          gh release download "$GITHUB_REF_NAME" \
            --pattern release-candidate-files.json \
            --dir target/tagged-candidate

      - name: Resolve clean public native consumers
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tools/apple/test-remote-consumer.sh "$VERSION"
          tools/flutter/test-public-apple-pod-consumer.sh "$VERSION"
          tools/android/test-consumer.sh --public --compile-only

      - name: Build and verify exact Flutter candidate
        run: |
          tools/flutter/package-release.sh --check
          VERSION="${GITHUB_REF_NAME#v}"
          FLUTTER_PACKAGE="$(node tools/release/package-identities.mjs flutter "$VERSION")"
          node tools/flutter/verify-publication.mjs verify-candidate \
            --archive "target/flutter-release/${FLUTTER_PACKAGE}-$VERSION.tar.gz" \
            --inventory target/flutter-release/package-inventory.json
          tools/release/write-candidate-inventory.sh \
            --source-revision "$(git rev-parse HEAD)" \
            --output target/current-flutter-candidate-files.json \
            target/flutter-release
          EXPECTED_FLUTTER="$(jq -S -c \
            '{schemaVersion, sourceRevision, files: [.files[] | select(.path | startswith("flutter-release/"))]}' \
            target/tagged-candidate/release-candidate-files.json)"
          CURRENT_FLUTTER="$(jq -S -c . target/current-flutter-candidate-files.json)"
          test "$CURRENT_FLUTTER" = "$EXPECTED_FLUTTER"

      - name: Upload Flutter release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-release-${{ github.ref_name }}
          path: target/flutter-release/
          if-no-files-found: error
          compression-level: 0

  verify-flutter-publication:
    name: Verify Flutter publication
    if: >-
      ${{ always() && github.event_name == 'push' && needs.flutter.result == 'success' }}
    needs: flutter
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Download preserved Flutter candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flutter-release-${{ github.ref_name }}
          path: target/flutter-release/

      - name: Download and verify public pub.dev archive
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          FLUTTER_PACKAGE="$(node tools/release/package-identities.mjs flutter "$RELEASE_VERSION")"
          ARCHIVE="target/flutter-release/public-${FLUTTER_PACKAGE}-$RELEASE_VERSION.tar.gz"
          URL="https://pub.dev/api/archives/${FLUTTER_PACKAGE}-$RELEASE_VERSION.tar.gz"
          for attempt in {1..120}; do
            if curl --fail --location --output "$ARCHIVE" "$URL"; then
              break
            fi
            rm -f "$ARCHIVE"
            sleep 30
          done
          test -s "$ARCHIVE"
          node tools/flutter/verify-publication.mjs verify-public \
            --archive "$ARCHIVE" \
            --inventory target/flutter-release/package-inventory.json \
            --output target/flutter-release/publication-evidence.json

      - name: Upload public Flutter verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-publication-${{ github.ref_name }}
          path: |
            target/flutter-release/public-*.tar.gz
            target/flutter-release/publication-evidence.json
          if-no-files-found: error
          compression-level: 0

  complete-release:
    name: Complete synchronized prerelease
    if: >-
      ${{ always() && github.event_name == 'push' &&
          needs.verify-flutter-publication.result == 'success' }}
    needs: verify-flutter-publication
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified Flutter candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flutter-release-${{ github.ref_name }}
          path: target/flutter-release/

      - name: Download public Flutter verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flutter-publication-${{ github.ref_name }}
          path: target/flutter-publication/

      - name: Attach verified Flutter evidence and complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            target/flutter-release/* \
            target/flutter-publication/* \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
