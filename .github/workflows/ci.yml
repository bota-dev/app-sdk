name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CLI_VERSION: "12.0.2"

permissions:
  contents: read

jobs:
  quality:
    name: Rust and tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Node.js dependencies
        run: npm ci

      - name: Test repository tooling
        run: npm run test:tooling

      - name: Validate React Native public API contract
        run: node tools/baseline/react-native-api-contract.mjs validate --contract protocol/baseline/react-native-public-api-0.0.65.json --baseline-metadata protocol/baseline/react-native-sdk-0.0.65.json

      - name: Validate release manifest
        run: cargo xtask release validate release/examples/1.1.0.json

      - name: Check generated protocol constants
        run: cargo xtask protocol generate --check

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test shipping native C ABI
        run: tools/ffi-smoke/run-native-c-smoke.sh

      - name: Test UniFFI binding decision spike
        run: |
          cargo test -p bota-device-sdk-ffi-smoke --features uniffi-spike --all-targets
          cargo build -p bota-device-sdk-ffi-smoke --features uniffi-spike
          cargo run -p bota-device-sdk-uniffi-bindgen -- generate --no-format --library --language swift --language kotlin --out-dir target/ffi-smoke target/debug/libbota_device_sdk_ffi_smoke.so

  react-native:
    name: React Native package foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frameworks/react-native/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Install repository tooling
        run: npm ci

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Verify React Native package foundation
        working-directory: frameworks/react-native
        run: npm run verify

      - name: Pack immutable npm candidate
        working-directory: frameworks/react-native
        run: |
          mkdir -p ../../target/react-native-release
          npx --yes "npm@$NPM_CLI_VERSION" pack --pack-destination ../../target/react-native-release

      - name: Upload React Native candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-native-ci-${{ github.sha }}
          path: target/react-native-release/
          if-no-files-found: error
          compression-level: 0

  android-native:
    name: Android AAR, React Native, and API 26/35 consumers
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust Android build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "emulator" \
            "platform-tools" \
            "system-images;android-26;google_apis;x86" \
            "system-images;android-35;google_apis;x86_64"

      - name: Install repository tooling
        run: npm ci

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Enable Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Build one immutable Android release payload
        run: |
          tools/android/package-release.sh --check
          tools/android/install-release-repository.sh target/android-release target/android-m2
          platforms/android/gradlew -p platforms/android \
            :sdk:testDebugUnitTest \
            :sdk:lintRelease \
            :sdk:assembleDebug \
            :sdk:assembleDebugAndroidTest
          tools/android/test-legacy-consumer.sh --mode source --compile-only \
            --repository target/android-m2
          tools/android/test-legacy-consumer.sh --mode binary --compile-only \
            --repository target/android-m2
          tools/android/test-consumer.sh --compile-only \
            --repository target/android-m2

      - name: Inspect packaged native libraries
        run: tools/android/inspect-aar.sh "target/android-release/bota-android-sdk-$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sdk-version.toml).aar"

      - name: Test React Native Android adapter consumer
        run: tools/react-native/test-android-adapter.sh --repository target/android-m2

      - name: Test API 26 legacy location and consumers
        run: tools/android/test-emulator-lane.sh --api 26

      - name: Test API 35 Bluetooth permissions and consumers
        run: tools/android/test-emulator-lane.sh --api 35

      - name: Upload non-publishing Android evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-ci-${{ github.sha }}
          path: target/android-release/
          if-no-files-found: error
          compression-level: 0

  react-native-apple:
    name: React Native Apple lifecycle adapter
    runs-on: macos-15
    env:
      BOTA_EXPECTED_RUBY_VERSION: "3.3.12"
      BOTA_EXPECTED_XCODE_BUILD: 17C529
      BOTA_EXPECTED_XCODE_VERSION: "26.3"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frameworks/react-native/package-lock.json

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Install and verify pinned Apple build tooling
        working-directory: frameworks/react-native
        run: |
          test "$(ruby -e 'print RUBY_VERSION')" = "$BOTA_EXPECTED_RUBY_VERSION"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "$BOTA_EXPECTED_XCODE_VERSION"
          test "$(xcodebuild -version | sed -n '2s/^Build version //p')" = "$BOTA_EXPECTED_XCODE_BUILD"
          gem install --no-document bundler -v 2.6.9
          bundle _2.6.9_ config set path "$RUNNER_TEMP/bota-rn-apple-bundle"
          bundle _2.6.9_ install
          bundle _2.6.9_ exec ruby -e 'require "cocoapods"; require "xcodeproj"; abort unless Pod::VERSION == "1.16.2" && Xcodeproj::VERSION == "1.27.0"'

      - name: Test Apple lifecycle coordinator
        working-directory: frameworks/react-native
        run: npm run test:apple:lifecycle

      - name: Test React Native Apple SPM compatibility
        working-directory: frameworks/react-native
        run: npm run test:apple:spm-workaround

      - name: Build linked iOS consumer
        working-directory: frameworks/react-native
        run: bundle _2.6.9_ exec npm run test:apple:integration

  apple:
    name: Apple package and consumer
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Run shipping Swift caller
        run: tools/ffi-smoke/run-native-swift-smoke.sh

      - name: Test Apple package and XCFramework
        run: tools/apple/test-package.sh -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test external Apple consumer
        run: tools/apple/test-consumer.sh

      - name: Compile generic iOS device target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppleSDK \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../target/apple-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Compile generic iOS simulator target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppleSDK \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../../target/apple-ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Inspect Apple binary slices
        run: |
          xcrun lipo -info platforms/apple/Artifacts/BotaDeviceSDKCore.xcframework/ios-arm64_x86_64-simulator/libbota_device_sdk_ffi.a
          xcrun lipo -info platforms/apple/Artifacts/BotaDeviceSDKCore.xcframework/macos-arm64_x86_64/libbota_device_sdk_ffi.a

      - name: Test Apple release metadata
        run: node --test tools/release/generate-apple-*.test.mjs

      - name: Generate unpublished Apple release evidence
        run: tools/apple/package-release.sh

      - name: Upload unpublished Apple evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-package-${{ github.sha }}
          path: target/apple-release/
          if-no-files-found: error
          compression-level: 0

      - name: Run generated comparison binding
        run: tools/ffi-smoke/run-uniffi-swift-smoke.sh

  release-candidate:
    name: Release candidate inventory
    needs: [android-native, apple, react-native]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download Android candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-ci-${{ github.sha }}
          path: target/android-release/

      - name: Download Apple candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-package-${{ github.sha }}
          path: target/apple-release/

      - name: Download React Native candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: react-native-ci-${{ github.sha }}
          path: target/react-native-release/

      - name: Write candidate inventory
        run: |
          tools/release/write-candidate-inventory.sh \
            --source-revision "$GITHUB_SHA" \
            --output target/release-candidate-files.json \
            target/apple-release target/android-release target/react-native-release
          sha256sum target/release-candidate-files.json \
            > target/release-candidate-files.json.sha256
          {
            echo '### Annotated tag candidate inventory'
            echo '```text'
            cat target/release-candidate-files.json.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            target/release-candidate-files.json
            target/release-candidate-files.json.sha256
          if-no-files-found: error
