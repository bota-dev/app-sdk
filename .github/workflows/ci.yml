name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Preserve every main-branch candidate; only superseded PR runs are expendable.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CLI_VERSION: "12.0.2"

permissions:
  contents: read

jobs:
  quality:
    name: Rust and tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out maintenance React Native workflow baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bota-dev/react-native-sdk
          ref: e11fde5be40027ec6cf1985fc0eadb00ece23e65
          path: .ci/react-native-workflow-baseline

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .ci/react-native-workflow-baseline/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install maintenance React Native workflow dependencies
        working-directory: .ci/react-native-workflow-baseline
        run: npm ci

      - name: Test repository tooling
        run: npm run test:tooling

      - name: Verify cross-SDK workflow evidence
        run: npm run test:workflows -- --sdk-path .ci/react-native-workflow-baseline

      - name: Validate React Native public API contract
        run: node tools/baseline/react-native-api-contract.mjs validate --contract protocol/baseline/react-native-public-api-0.0.65.json --baseline-metadata protocol/baseline/react-native-sdk-0.0.65.json

      - name: Validate release manifest
        run: cargo xtask release validate release/examples/2.0.0-beta.2.json

      - name: Check generated protocol constants
        run: cargo xtask protocol generate --check

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test shipping native C ABI
        run: tools/ffi-smoke/run-native-c-smoke.sh

      - name: Test UniFFI binding decision spike
        run: |
          cargo test -p bota-device-sdk-ffi-smoke --features uniffi-spike --all-targets
          cargo build -p bota-device-sdk-ffi-smoke --features uniffi-spike
          cargo run -p bota-device-sdk-uniffi-bindgen -- generate --no-format --library --language swift --language kotlin --out-dir target/ffi-smoke target/debug/libbota_device_sdk_ffi_smoke.so

  react-native:
    name: React Native package foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frameworks/react-native/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install repository tooling
        run: npm ci

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Verify React Native package foundation
        working-directory: frameworks/react-native
        run: npm run verify

      - name: Pack immutable npm candidate
        working-directory: frameworks/react-native
        run: |
          mkdir -p ../../target/react-native-release
          npx --yes "npm@$NPM_CLI_VERSION" pack --pack-destination ../../target/react-native-release

      - name: Upload React Native candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-native-ci-${{ github.sha }}
          path: target/react-native-release/
          if-no-files-found: error
          compression-level: 0

  web:
    name: Web SDK package and Vite consumer
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/playwright-browsers
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frameworks/web/package-lock.json
            tests/consumers/web-vite/package-lock.json

      - name: Set up Rust WebAssembly target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Install Web gate dependencies and pinned Chromium browser
        run: |
          npx --yes "npm@$NPM_CLI_VERSION" ci
          npx --yes "npm@$NPM_CLI_VERSION" ci --prefix tests/consumers/web-vite
          tests/consumers/web-vite/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify Web package and packed consumer
        run: |
          npm run web:verify
          test "$(jq -r .sourceRevision target/web-release/web-package-files.json)" = "$GITHUB_SHA"

      - name: Upload Web candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-ci-${{ github.sha }}
          path: target/web-release/
          if-no-files-found: error
          compression-level: 0

  android-native:
    name: Android AAR, React Native, and API 26/35 consumers
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frameworks/react-native/package-lock.json

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust Android build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install pinned Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "emulator" \
            "platform-tools" \
            "system-images;android-26;google_apis;x86" \
            "system-images;android-35;google_apis;x86_64"

      - name: Install repository tooling
        run: npm ci

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Enable Android emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Build one immutable Android release payload
        run: |
          tools/android/package-release.sh --check
          tools/android/install-release-repository.sh target/android-release target/android-m2
          platforms/android/gradlew -p platforms/android \
            :sdk:lintRelease \
            :sdk:assembleDebug \
            :sdk:assembleDebugAndroidTest
          platforms/android/gradlew -p platforms/android :sdk:testDebugUnitTest
          tools/android/test-legacy-consumer.sh --mode source --compile-only \
            --repository target/android-m2
          tools/android/test-legacy-consumer.sh --mode binary --compile-only \
            --repository target/android-m2
          tools/android/test-consumer.sh --compile-only \
            --repository target/android-m2

      - name: Inspect packaged native libraries
        run: tools/android/inspect-aar.sh "target/android-release/bota-app-sdk-$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sdk-version.toml).aar"

      - name: Test React Native Android adapter consumer
        run: tools/react-native/test-android-adapter.sh --repository target/android-m2

      - name: Test API 26 legacy location and consumers
        run: tools/android/test-emulator-lane.sh --api 26

      - name: Test API 35 Bluetooth permissions and consumers
        run: tools/android/test-emulator-lane.sh --api 35

      - name: Upload non-publishing Android evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ci-${{ github.sha }}
          path: target/android-release/
          if-no-files-found: error
          compression-level: 0

  react-native-apple:
    name: React Native Apple lifecycle adapter
    runs-on: macos-15
    env:
      BOTA_EXPECTED_RUBY_VERSION: "3.3.12"
      BOTA_EXPECTED_XCODE_BUILD: 17C529
      BOTA_EXPECTED_XCODE_VERSION: "26.3"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frameworks/react-native/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Install and verify pinned Apple build tooling
        working-directory: frameworks/react-native
        run: |
          test "$(ruby -e 'print RUBY_VERSION')" = "$BOTA_EXPECTED_RUBY_VERSION"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "$BOTA_EXPECTED_XCODE_VERSION"
          test "$(xcodebuild -version | sed -n '2s/^Build version //p')" = "$BOTA_EXPECTED_XCODE_BUILD"
          gem install --no-document bundler -v 2.6.9
          bundle _2.6.9_ config set path "$RUNNER_TEMP/bota-rn-apple-bundle"
          bundle _2.6.9_ install
          bundle _2.6.9_ exec ruby -e 'require "cocoapods"; require "xcodeproj"; abort unless Pod::VERSION == "1.16.2" && Xcodeproj::VERSION == "1.27.0"'

      - name: Test Apple lifecycle coordinator
        working-directory: frameworks/react-native
        run: npm run test:apple:lifecycle

      - name: Test React Native Apple SPM compatibility
        working-directory: frameworks/react-native
        run: npm run test:apple:spm-workaround

      - name: Build linked iOS consumer
        working-directory: frameworks/react-native
        run: bundle _2.6.9_ exec npm run test:apple:integration

  apple:
    name: Apple package and consumer
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Run shipping Swift caller
        run: tools/ffi-smoke/run-native-swift-smoke.sh

      - name: Test Apple package and XCFramework
        run: tools/apple/test-package.sh -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test external Apple consumer
        run: tools/apple/test-consumer.sh

      - name: Compile generic iOS device target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppSDK \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../target/apple-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Compile generic iOS simulator target
        working-directory: platforms/apple
        run: |
          xcodebuild \
            -scheme BotaAppSDK \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../../target/apple-ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Inspect Apple binary slices
        run: |
          xcrun lipo -info platforms/apple/Artifacts/BotaDeviceSDKCore.xcframework/ios-arm64_x86_64-simulator/libbota_device_sdk_ffi.a
          xcrun lipo -info platforms/apple/Artifacts/BotaDeviceSDKCore.xcframework/macos-arm64_x86_64/libbota_device_sdk_ffi.a

      - name: Test Apple release metadata
        run: node --test tools/release/generate-apple-*.test.mjs

      - name: Generate unpublished Apple release evidence
        run: tools/apple/package-release.sh --evidence-only

      - name: Lint exact CocoaPods archive
        run: |
          gem install --no-document cocoapods -v 1.16.2
          tools/apple/test-pod-archive.sh

      - name: Upload unpublished Apple evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-package-${{ github.sha }}
          path: target/apple-release/
          if-no-files-found: error
          compression-level: 0

      - name: Run generated comparison binding
        run: tools/ffi-smoke/run-uniffi-swift-smoke.sh

  flutter:
    name: Flutter package candidate
    runs-on: macos-15
    outputs:
      candidate-ready: ${{ steps.package.outputs.candidate-ready }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust native targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install repository tooling
        run: npm ci

      - name: Verify isolated CocoaPods toolchain with public predecessor
        run: tools/flutter/install-pinned-cocoapods.sh

      - name: Compile public beta.11 CocoaPods consumer
        run: tools/flutter/test-public-apple-pod-consumer.sh 1.2.0-beta.11

      - name: Verify Flutter package and build candidate when releasable
        id: package
        run: tools/flutter/package-release.sh --ci

      - name: Verify preserved Flutter candidate
        if: steps.package.outputs.candidate-ready == 'true'
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sdk-version.toml)"
          node tools/flutter/verify-publication.mjs verify-candidate \
            --archive "target/flutter-release/bota_app_sdk-$VERSION.tar.gz" \
            --inventory target/flutter-release/package-inventory.json

      - name: Upload Flutter candidate
        if: steps.package.outputs.candidate-ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-ci-${{ github.sha }}
          path: target/flutter-release/
          if-no-files-found: error
          compression-level: 0

  release-candidate:
    name: Release candidate inventory
    needs: [android-native, apple, react-native, web, flutter]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download Android candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-ci-${{ github.sha }}
          path: target/android-release/

      - name: Download Apple candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apple-package-${{ github.sha }}
          path: target/apple-release/

      - name: Download React Native candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: react-native-ci-${{ github.sha }}
          path: target/react-native-release/

      - name: Download Web candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-ci-${{ github.sha }}
          path: target/web-release/

      - name: Download Flutter candidate
        if: needs.flutter.outputs.candidate-ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flutter-ci-${{ github.sha }}
          path: target/flutter-release/

      - name: Write candidate inventory
        env:
          FLUTTER_CANDIDATE_READY: ${{ needs.flutter.outputs.candidate-ready }}
        run: |
          candidate_roots=(
            target/apple-release
            target/android-release
            target/react-native-release
            target/web-release
          )
          if [[ "$FLUTTER_CANDIDATE_READY" == "true" ]]; then
            candidate_roots+=(target/flutter-release)
          fi
          tools/release/write-candidate-inventory.sh \
            --source-revision "$GITHUB_SHA" \
            --output target/release-candidate-files.json \
            "${candidate_roots[@]}"
          sha256sum target/release-candidate-files.json \
            > target/release-candidate-files.json.sha256
          {
            echo '### Annotated tag candidate inventory'
            echo '```text'
            cat target/release-candidate-files.json.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            target/release-candidate-files.json
            target/release-candidate-files.json.sha256
          if-no-files-found: error
