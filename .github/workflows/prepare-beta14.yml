name: Prepare beta.14 canonical manifests
on:
  workflow_dispatch:
  push:
    branches: [release/sdk-beta14-20261008]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install pinned Android and CocoaPods tooling
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          tools/flutter/install-pinned-cocoapods.sh
      - name: Generate canonical client identity and Codegen
        run: |
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sdk-version.toml)" = "2.0.0-beta.14"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p target/prepared-beta14
          git rev-parse HEAD > target/prepared-beta14/source-revision.txt
          npm ci
          npm ci --prefix frameworks/react-native
          cargo xtask client-identity generate
          cargo xtask client-identity generate --check
          npm run codegen --prefix frameworks/react-native
          npm run codegen:check --prefix frameworks/react-native
      - name: Generate Apple manifests and commit disposable generator snapshot
        run: |
          tools/apple/package-release.sh --write-package-manifest
          swift package dump-package
          git -c core.autocrlf=false add \
            frameworks/web/src/sdkIdentity.ts frameworks/react-native/src/sdkIdentity.ts \
            platforms/apple/Sources/BotaAppSDK/SdkIdentity.swift \
            platforms/android/sdk/src/main/kotlin/dev/bota/sdk/SdkIdentity.kt \
            frameworks/flutter/bota_app_sdk/lib/src/sdk_identity.dart \
            frameworks/react-native/generated/codegen-contract.json \
            Package.swift platforms/apple/BotaAppSDK.podspec
          git diff --cached --check
          git -c user.name='OpenAI Codex' -c user.email='noreply@openai.com' commit -m 'chore: prepare canonical beta.14 generator snapshot' -m 'Co-Authored-By: OpenAI Codex <noreply@openai.com>'
          test -z "$(git status --porcelain)"
      - name: Generate canonical Flutter example and complete inventory
        run: tools/flutter/package-release.sh --write-example
      - name: Record generated patch against the original candidate
        if: always()
        run: |
          if test -f target/prepared-beta14/source-revision.txt; then
            git diff --binary "$(cat target/prepared-beta14/source-revision.txt)" > target/prepared-beta14/generated.patch
          fi
      - name: Preserve generated patch and archive evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta14-prepared-${{ github.sha }}
          path: |
            target/prepared-beta14/
            target/apple-release/
            target/flutter-release/
          if-no-files-found: error
          compression-level: 0
