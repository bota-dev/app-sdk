name: License Gate

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  license-gate:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frameworks/react-native/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check npm dependency licenses
        run: npm run check:licenses

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Check React Native dependency licenses
        working-directory: frameworks/react-native
        run: npm run license-check

      - name: Check Cargo dependency licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
