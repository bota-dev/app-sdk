name: License Gate

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  license-gate:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frameworks/react-native/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install pinned Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check npm dependency licenses
        run: npm run check:licenses

      - name: Install React Native package dependencies
        working-directory: frameworks/react-native
        run: npm ci

      - name: Check React Native dependency licenses
        working-directory: frameworks/react-native
        run: npm run license-check

      - name: Check Android locks, checksums, SPDX, and reviewed Maven licenses
        run: |
          test -s platforms/android/sdk/gradle.lockfile
          test -s platforms/android/settings-gradle.lockfile
          test -s platforms/android/gradle/verification-metadata.xml
          tools/android/package-release.sh --check
          tools/android/verify-publication.sh target/android-release
          node tools/android/check-maven-license-policy.mjs \
            "target/android-release/bota-android-sdk-$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sdk-version.toml).module" \
            target/android-release/BotaAndroidSDK.spdx.json \
            protocol/baseline/android-maven-license-policy.json

      - name: Check Cargo dependency licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
