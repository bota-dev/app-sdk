name: Prepare RN transfer recovery

on:
  push:
    branches: [codex/rn-transfer-recovery-20261014]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rn-transfer-recovery-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Run physical-failure regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/rn-transfer-recovery
          recording=0
          connection=0
          cargo test --locked -p bota-device-sdk-core --test recording_transfer_workflow 2>&1 | tee target/rn-transfer-recovery/recording.log || recording=$?
          cargo test --locked -p bota-device-sdk-core --test connection_workflow 2>&1 | tee target/rn-transfer-recovery/connection.log || connection=$?
          printf '{"sourceRevision":"%s","recordingExit":%s,"connectionExit":%s}\n' "$GITHUB_SHA" "$recording" "$connection" > target/rn-transfer-recovery/regressions.json
          test "$recording" -eq 0
          test "$connection" -eq 0
      - run: npm ci
      - name: Generate canonical JavaScript from tested Rust
        run: |
          cargo xtask client-identity generate
          cargo xtask client-identity generate --check
          npm run react-native:generate-js-core
          npm run react-native:generate-js-core -- --check
          cp frameworks/react-native/src/jsHost/generated/core.ts target/rn-transfer-recovery/core.ts
          (cd target/rn-transfer-recovery && sha256sum core.ts > core.ts.sha256)
          cp frameworks/react-native/src/sdkIdentity.ts target/rn-transfer-recovery/rn-identity.ts
          cp frameworks/web/src/sdkIdentity.ts target/rn-transfer-recovery/web-identity.ts
          cp platforms/apple/Sources/BotaAppSDK/SdkIdentity.swift target/rn-transfer-recovery/apple-identity.swift
          cp platforms/android/sdk/src/main/kotlin/dev/bota/sdk/SdkIdentity.kt target/rn-transfer-recovery/android-identity.kt
          cp frameworks/flutter/bota_app_sdk/lib/src/sdk_identity.dart target/rn-transfer-recovery/flutter-identity.dart
          node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; const p="target/rn-transfer-recovery/core.ts"; const b=fs.readFileSync(p); fs.writeFileSync("target/rn-transfer-recovery/generation.json",JSON.stringify({sourceRevision:process.env.GITHUB_SHA,bytes:b.length,sha256:crypto.createHash("sha256").update(b).digest("hex")})+"\n");'
      - name: Retain regressions and canonical output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rn-transfer-recovery-${{ github.sha }}
          path: target/rn-transfer-recovery/
          if-no-files-found: error
          retention-days: 7

  prepare-native-manifests:
    if: github.ref == 'refs/heads/codex/rn-transfer-recovery-20261014'
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install pinned Android and CocoaPods tooling
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          tools/flutter/install-pinned-cocoapods.sh
      - name: Restore same-run canonical JavaScript
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rn-transfer-recovery-${{ github.sha }}
          path: target/beta19-generated-js/
      - name: Generate canonical identities and Codegen
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p target/prepared-beta19
          git rev-parse HEAD > target/prepared-beta19/source-revision.txt
          (cd target/beta19-generated-js && shasum -a 256 -c core.ts.sha256)
          cp target/beta19-generated-js/core.ts frameworks/react-native/src/jsHost/generated/core.ts
          npm ci
          npm ci --prefix frameworks/react-native
          cargo xtask client-identity generate
          cargo xtask client-identity generate --check
          npm run codegen --prefix frameworks/react-native
          npm run codegen:check --prefix frameworks/react-native
          npm run react-native:generate-js-core -- --provenance-only
      - name: Generate Apple pins and disposable clean-source snapshot
        run: |
          tools/apple/package-release.sh --write-package-manifest
          swift package dump-package
          git -c core.autocrlf=false add \
            frameworks/react-native/src/jsHost/generated/core.ts \
            frameworks/web/src/sdkIdentity.ts frameworks/react-native/src/sdkIdentity.ts \
            platforms/apple/Sources/BotaAppSDK/SdkIdentity.swift \
            platforms/android/sdk/src/main/kotlin/dev/bota/sdk/SdkIdentity.kt \
            frameworks/flutter/bota_app_sdk/lib/src/sdk_identity.dart \
            frameworks/react-native/generated/codegen-contract.json \
            Package.swift platforms/apple/BotaAppSDK.podspec
          git diff --cached --check
          git -c user.name='OpenAI Codex' -c user.email='noreply@openai.com' commit \
            -m 'chore: prepare canonical beta.19 generator snapshot' \
            -m 'Co-Authored-By: OpenAI Codex <noreply@openai.com>'
          test -z "$(git status --porcelain)"
      - name: Generate the complete Flutter example inventory
        run: tools/flutter/package-release.sh --write-example
      - name: Preserve the allowlisted generated patch
        if: always()
        run: |
          if test -f target/prepared-beta19/source-revision.txt; then
            git diff --binary "$(cat target/prepared-beta19/source-revision.txt)" > target/prepared-beta19/generated.patch
          fi
      - name: Preserve generated preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta19-prepared-${{ github.sha }}
          path: target/prepared-beta19/
          if-no-files-found: error
          compression-level: 0
