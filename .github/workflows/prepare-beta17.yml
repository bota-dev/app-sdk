name: Prepare beta.17 canonical generated artifacts

on:
  workflow_dispatch:
  push:
    branches: [codex/rn-js-beta17-preparation]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generated-js:
    if: github.ref == 'refs/heads/codex/rn-js-beta17-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - name: Generate executable JS from the exact versioned Rust source
        run: |
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sdk-version.toml)" = '2.0.0-beta.17'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --ignore-scripts
          npm run react-native:generate-js-core
          npm run react-native:generate-js-core -- --check
          mkdir -p target/beta17-generated-js
          cp frameworks/react-native/src/jsHost/generated/core.ts target/beta17-generated-js/core.ts
          (cd target/beta17-generated-js && sha256sum core.ts > core.ts.sha256)
      - name: Preserve canonical JavaScript
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta17-generated-js-${{ github.sha }}
          path: target/beta17-generated-js/
          if-no-files-found: error
          compression-level: 0

  prepare-native-manifests:
    if: github.ref == 'refs/heads/codex/rn-js-beta17-preparation'
    needs: generated-js
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install pinned Android and CocoaPods tooling
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          tools/flutter/install-pinned-cocoapods.sh
      - name: Restore same-run canonical JavaScript
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beta17-generated-js-${{ github.sha }}
          path: target/beta17-generated-js/
      - name: Generate canonical identities and Codegen
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p target/prepared-beta17
          git rev-parse HEAD > target/prepared-beta17/source-revision.txt
          (cd target/beta17-generated-js && shasum -a 256 -c core.ts.sha256)
          cp target/beta17-generated-js/core.ts frameworks/react-native/src/jsHost/generated/core.ts
          npm ci --ignore-scripts
          npm ci --prefix frameworks/react-native
          cargo xtask client-identity generate
          cargo xtask client-identity generate --check
          npm run codegen --prefix frameworks/react-native
          npm run codegen:check --prefix frameworks/react-native
          npm run react-native:generate-js-core -- --provenance-only
      - name: Generate Apple pins and disposable clean-source snapshot
        run: |
          tools/apple/package-release.sh --write-package-manifest
          swift package dump-package
          git -c core.autocrlf=false add \
            frameworks/react-native/src/jsHost/generated/core.ts \
            frameworks/web/src/sdkIdentity.ts frameworks/react-native/src/sdkIdentity.ts \
            platforms/apple/Sources/BotaAppSDK/SdkIdentity.swift \
            platforms/android/sdk/src/main/kotlin/dev/bota/sdk/SdkIdentity.kt \
            frameworks/flutter/bota_app_sdk/lib/src/sdk_identity.dart \
            frameworks/react-native/generated/codegen-contract.json \
            Package.swift platforms/apple/BotaAppSDK.podspec
          git diff --cached --check
          git -c user.name='OpenAI Codex' -c user.email='noreply@openai.com' commit \
            -m 'chore: prepare canonical beta.17 generator snapshot' \
            -m 'Co-Authored-By: OpenAI Codex <noreply@openai.com>'
          test -z "$(git status --porcelain)"
      - name: Generate the complete Flutter example inventory
        run: tools/flutter/package-release.sh --write-example
      - name: Preserve the allowlisted generated patch
        if: always()
        run: |
          if test -f target/prepared-beta17/source-revision.txt; then
            git diff --binary "$(cat target/prepared-beta17/source-revision.txt)" > target/prepared-beta17/generated.patch
          fi
      - name: Preserve generated preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta17-prepared-${{ github.sha }}
          path: target/prepared-beta17/
          if-no-files-found: error
          compression-level: 0
