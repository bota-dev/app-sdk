name: Publish Apple CocoaPod

on:
  workflow_call:
    secrets:
      COCOAPODS_TRUNK_TOKEN:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish and verify Apple SDK
    runs-on: macos-15
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download immutable Apple payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apple-release-${{ github.ref_name }}
          path: target/apple-release/

      - name: Verify tag, asset, root manifest, and podspec
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APPLE_PACKAGE="$(node tools/release/package-identities.mjs apple "$VERSION")"
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sdk-version.toml)" = "$VERSION"
          test "$(sed -n 's/.*spec.version = "\([^"]*\)".*/\1/p' platforms/apple/${APPLE_PACKAGE}.podspec)" = "$VERSION"
          (
            cd target/apple-release
            shasum -a 256 -c BotaDeviceSDKCore.xcframework.zip.sha256
            shasum -a 256 -c ${APPLE_PACKAGE}.cocoapods.zip.sha256
          )
          CHECKSUM="$(cat target/apple-release/BotaDeviceSDKCore.xcframework.swiftpm-checksum)"
          test "$CHECKSUM" = "$(swift package compute-checksum target/apple-release/BotaDeviceSDKCore.xcframework.zip)"
          grep -F "releases/download/v$VERSION/BotaDeviceSDKCore.xcframework.zip" Package.swift
          grep -F "checksum: \"$CHECKSUM\"" Package.swift
          POD_CHECKSUM="$(shasum -a 256 target/apple-release/${APPLE_PACKAGE}.cocoapods.zip | awk '{print $1}')"
          node tools/release/generate-public-podspec.mjs \
            --sdk-version "$VERSION" \
            --artifact-checksum "$POD_CHECKSUM" \
            --output platforms/apple/${APPLE_PACKAGE}.podspec \
            --check
          ! grep -q 'prepare_command' platforms/apple/${APPLE_PACKAGE}.podspec

      - name: Install exact CocoaPods client
        run: gem install --no-document cocoapods -v 1.16.2

      - name: Publish absent pod and verify public metadata
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APPLE_PACKAGE="$(node tools/release/package-identities.mjs apple "$VERSION")"
          POD_URL="https://github.com/bota-dev/app-sdk/releases/download/v$VERSION/${APPLE_PACKAGE}.cocoapods.zip"
          POD_CHECKSUM="$(shasum -a 256 target/apple-release/${APPLE_PACKAGE}.cocoapods.zip | awk '{print $1}')"
          SPEC_URL="https://trunk.cocoapods.org/api/v1/pods/${APPLE_PACKAGE}/specs/$VERSION"
          existing="$(mktemp)"
          fetch_public_spec() {
            local status
            status="$(curl --silent --show-error --location --retry 3 \
              --connect-timeout 10 --max-time 60 --output "$existing" \
              --write-out '%{http_code}' "$SPEC_URL")"
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "CocoaPods Trunk lookup failed: HTTP $status" >&2; exit 1 ;;
            esac
          }
          verify_public_spec() {
            jq -e --arg version "$VERSION" --arg url "$POD_URL" \
              --arg checksum "$POD_CHECKSUM" \
              '.version == $version and .source.http == $url and .source.sha256 == $checksum' \
              "$existing" >/dev/null
          }
          if fetch_public_spec; then
            verify_public_spec
          else
            test -n "$COCOAPODS_TRUNK_TOKEN"
            # Trunk may register the pod before its CLI finishes or times out.
            pod trunk push platforms/apple/${APPLE_PACKAGE}.podspec || true
          fi
          for attempt in {1..30}; do
            if fetch_public_spec; then
              verify_public_spec
              break
            fi
            sleep 10
          done
          fetch_public_spec
          verify_public_spec
