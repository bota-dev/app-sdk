name: Promote Apple CocoaPod to SDK Specs

on:
  workflow_call:
    inputs:
      slack-approved:
        type: boolean
        required: false
        default: false

concurrency:
  group: bota-cocoapods-specs-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SLACK_SDK_PRODUCTION_APPROVAL_ENABLED: ${{ inputs.slack-approved && 'true' || 'false' }}

jobs:
  publish:
    name: Publish and verify Apple SDK
    runs-on: macos-15
    timeout-minutes: 90
    # Preserve original tag context and the SDK repository's approved job token.
    environment: release
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download immutable Apple payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-release-${{ github.ref_name }}
          path: target/apple-release/

      - name: Verify tag, asset, root manifest, and podspec
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APPLE_PACKAGE="$(node tools/release/package-identities.mjs apple "$VERSION")"
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sdk-version.toml)" = "$VERSION"
          test "$(sed -n 's/.*spec.version = "\([^"]*\)".*/\1/p' platforms/apple/${APPLE_PACKAGE}.podspec)" = "$VERSION"
          (
            cd target/apple-release
            shasum -a 256 -c BotaDeviceSDKCore.xcframework.zip.sha256
            shasum -a 256 -c ${APPLE_PACKAGE}.cocoapods.zip.sha256
          )
          CHECKSUM="$(cat target/apple-release/BotaDeviceSDKCore.xcframework.swiftpm-checksum)"
          test "$CHECKSUM" = "$(swift package compute-checksum target/apple-release/BotaDeviceSDKCore.xcframework.zip)"
          grep -F "releases/download/v$VERSION/BotaDeviceSDKCore.xcframework.zip" Package.swift
          grep -F "checksum: \"$CHECKSUM\"" Package.swift
          POD_CHECKSUM="$(shasum -a 256 target/apple-release/${APPLE_PACKAGE}.cocoapods.zip | awk '{print $1}')"
          node tools/release/generate-public-podspec.mjs \
            --sdk-version "$VERSION" \
            --artifact-checksum "$POD_CHECKSUM" \
            --output platforms/apple/${APPLE_PACKAGE}.podspec \
            --check
          ! grep -q 'prepare_command' platforms/apple/${APPLE_PACKAGE}.podspec

      - name: Install exact CocoaPods client
        run: gem install --no-document cocoapods -v 1.16.2

      - name: Download the frozen Slack request inputs
        if: inputs.slack-approved
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ github.ref_name }}
          path: target/
      - name: Download the approved SDK execution binding
        if: inputs.slack-approved
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-slack-approval-${{ github.ref_name }}-${{ github.run_attempt }}
          path: target/
      - name: Refresh signed approval before promoting Specs
        if: inputs.slack-approved
        run: node tools/release/slack-sdk-release.mjs refresh

      - name: Append approved podspec to SDK Specs and verify public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APPLE_PACKAGE="$(node tools/release/package-identities.mjs apple "$VERSION")"
          POD_CHECKSUM="$(shasum -a 256 target/apple-release/${APPLE_PACKAGE}.cocoapods.zip | awk '{print $1}')"
          pod _1.16.2_ ipc spec "platforms/apple/${APPLE_PACKAGE}.podspec" > target/apple-release/approved.podspec.json
          tools/release/publish-owned-cocoapods.sh "$VERSION" target/apple-release/approved.podspec.json "$POD_CHECKSUM"
