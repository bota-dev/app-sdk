name: Prepare recording speech merged inputs

on:
  push:
    branches: [feat/realtime-speech-phase3]

# This branch-only workflow produces a reviewed patch, never a public release.
permissions:
  contents: read

concurrency:
  group: recording-speech-preparation-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generated-js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - run: npm ci
      - name: Generate and rebuild exact-source portable JavaScript
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/feat/realtime-speech-phase3
          test "$(node -p 'require("./package.json").version')" = 2.0.0-beta.24
          test -z "$(git status --porcelain)"
          cargo xtask client-identity generate
          cargo xtask client-identity generate --check
          npm run react-native:generate-js-core
          npm run react-native:generate-js-core -- --check
          mkdir -p target/recording-speech-generated
          cp frameworks/react-native/src/jsHost/generated/core.ts target/recording-speech-generated/core.ts
          git rev-parse HEAD > target/recording-speech-generated/source-revision.txt
          (cd target/recording-speech-generated && sha256sum core.ts > core.ts.sha256)
      - name: Preserve canonical Linux output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recording-speech-generated-${{ github.sha }}
          path: target/recording-speech-generated/
          if-no-files-found: error
          retention-days: 7

  native-manifests:
    needs: generated-js
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install pinned native package tooling
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1'
          python3 -I tools/android/provision_ndk.py 'ndk;28.2.13676358'
          tools/flutter/install-pinned-cocoapods.sh
      - name: Restore this run's canonical JavaScript
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recording-speech-generated-${{ github.sha }}
          path: target/recording-speech-generated/
      - name: Generate identities and versioned Codegen contract
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/feat/realtime-speech-phase3
          test "$(cat target/recording-speech-generated/source-revision.txt)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p target/recording-speech-prepared
          git rev-parse HEAD > target/recording-speech-prepared/source-revision.txt
          (cd target/recording-speech-generated && shasum -a 256 -c core.ts.sha256)
          cp target/recording-speech-generated/core.ts frameworks/react-native/src/jsHost/generated/core.ts
          npm ci
          npm ci --prefix frameworks/react-native
          cargo xtask client-identity generate
          cargo xtask client-identity generate --check
          npm run codegen --prefix frameworks/react-native
          npm run codegen:check --prefix frameworks/react-native
          npm run react-native:generate-js-core -- --provenance-only
      - name: Generate Apple checksums and a disposable clean snapshot
        run: |
          set -eu
          tools/apple/package-release.sh --write-package-manifest
          swift package dump-package
          git -c core.autocrlf=false add \
            frameworks/react-native/src/jsHost/generated/core.ts \
            frameworks/react-native/src/sdkIdentity.ts frameworks/web/src/sdkIdentity.ts \
            platforms/apple/Sources/BotaAppSDK/SdkIdentity.swift \
            platforms/android/sdk/src/main/kotlin/dev/bota/sdk/SdkIdentity.kt \
            frameworks/flutter/bota_app_sdk/lib/src/sdk_identity.dart \
            frameworks/react-native/generated/codegen-contract.json \
            Package.swift platforms/apple/BotaAppSDK.podspec
          git diff --cached --check
          git -c user.name='OpenAI Codex' -c user.email='noreply@openai.com' commit \
            -m 'chore: prepare canonical recording speech generator snapshot' \
            -m 'Co-Authored-By: OpenAI Codex <noreply@openai.com>'
          test -z "$(git status --porcelain)"
      - name: Generate and verify the complete Flutter release inventory
        run: |
          tools/flutter/package-release.sh --write-example
          cargo xtask release verify-tag v2.0.0-beta.24
          cargo test --locked -p xtask --test release_readiness --test release_manifest
          npm run test:release
      - name: Preserve only allowlisted generated changes
        run: |
          set -eu
          git diff --name-only "$GITHUB_SHA" > target/recording-speech-prepared/changed-files.txt
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = new Set(['frameworks/react-native/src/jsHost/generated/core.ts', 'frameworks/react-native/src/sdkIdentity.ts', 'frameworks/web/src/sdkIdentity.ts', 'platforms/apple/Sources/BotaAppSDK/SdkIdentity.swift', 'platforms/android/sdk/src/main/kotlin/dev/bota/sdk/SdkIdentity.kt', 'frameworks/flutter/bota_app_sdk/lib/src/sdk_identity.dart', 'frameworks/react-native/generated/codegen-contract.json', 'Package.swift', 'platforms/apple/BotaAppSDK.podspec', 'release/examples/2.0.0-beta.24.json']);
          const actual = readFileSync('target/recording-speech-prepared/changed-files.txt', 'utf8').trim().split('\n');
          if (actual.some(path => !expected.has(path))) throw Error('Unexpected generated source change');
          for (const required of ['frameworks/react-native/src/jsHost/generated/core.ts', 'Package.swift', 'platforms/apple/BotaAppSDK.podspec', 'release/examples/2.0.0-beta.24.json']) if (!actual.includes(required)) throw Error('Missing required generated output: '+required);
          NODE
          git diff --check "$GITHUB_SHA"
          git diff --binary "$GITHUB_SHA" > target/recording-speech-prepared/generated.patch
          cp target/recording-speech-generated/core.ts.sha256 target/recording-speech-prepared/
          cp target/apple-release/BotaDeviceSDKCore.xcframework.zip.sha256 target/recording-speech-prepared/
          cp target/apple-release/BotaAppSDK.cocoapods.zip.sha256 target/recording-speech-prepared/
          cp target/flutter-release/package-inventory.json target/recording-speech-prepared/flutter-package-inventory.json
          (cd target/recording-speech-prepared && shasum -a 256 generated.patch > generated.patch.sha256)
      - name: Retain reviewed preparation inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recording-speech-prepared-${{ github.sha }}
          path: target/recording-speech-prepared/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
