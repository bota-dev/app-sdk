name: Prepare lean recording speech runtime

on:
  push:
    branches: [feat/realtime-speech-phase3]

# This branch-only workflow produces a reviewed patch, never a public release.
permissions:
  contents: read

concurrency:
  group: recording-speech-preparation-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generated-js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - run: npm ci
      - name: Generate and rebuild exact-source portable JavaScript
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/feat/realtime-speech-phase3
          test "$(node -p 'require("./package.json").version')" = 2.0.0-beta.24
          test -z "$(git status --porcelain)"
          cargo xtask client-identity generate
          cargo xtask client-identity generate --check
          npm run react-native:generate-js-core
          npm run react-native:generate-js-core -- --check
          mkdir -p target/recording-speech-generated
          cp frameworks/react-native/src/jsHost/generated/core.ts target/recording-speech-generated/core.ts
          git rev-parse HEAD > target/recording-speech-generated/source-revision.txt
          (cd target/recording-speech-generated && sha256sum core.ts > core.ts.sha256)
      - name: Preserve canonical Linux output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recording-speech-generated-${{ github.sha }}
          path: target/recording-speech-generated/
          if-no-files-found: error
          retention-days: 7

