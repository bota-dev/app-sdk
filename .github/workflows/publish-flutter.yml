name: Publish Flutter package with pub.dev OIDC

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Configure pub.dev automated publishing for bota-dev/app-sdk with
# tag-pattern on pub.dev: v{{version}}
jobs:
  gate:
    if: github.ref_name != 'v1.2.0-beta.0'
    name: Verify protected Flutter candidate
    runs-on: ubuntu-latest
    environment: release
    outputs:
      needs-publish: ${{ steps.public-version.outputs.needs-publish }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Wait for and verify the ordered release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REVISION="$(git rev-parse HEAD)"
          ARTIFACT_ID=""
          for attempt in {1..120}; do
            RUN_ID="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$SOURCE_REVISION&event=push&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
            if [[ -n "$RUN_ID" ]]; then
              ARTIFACT_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
                | jq -r --arg name "flutter-release-$GITHUB_REF_NAME" \
                  '.artifacts[] | select(.name == $name and .expired == false) | .id' \
                | head -n 1)"
            fi
            [[ -z "$ARTIFACT_ID" ]] || break
            sleep 30
          done
          test -n "$ARTIFACT_ID"
          mkdir -p target/flutter-release
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > target/flutter-release.zip
          unzip -q target/flutter-release.zip -d target/flutter-release
          VERSION="${GITHUB_REF_NAME#v}"
          FLUTTER_PACKAGE="$(node tools/release/package-identities.mjs flutter "$VERSION")"
          test "$(jq -r .sourceRevision target/flutter-release/package-inventory.json)" \
            = "$SOURCE_REVISION"
          node tools/flutter/verify-publication.mjs verify-candidate \
            --archive "target/flutter-release/${FLUTTER_PACKAGE}-$VERSION.tar.gz" \
            --inventory target/flutter-release/package-inventory.json

      - name: Verify an occupied version or authorize OIDC publication
        id: public-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FLUTTER_PACKAGE="$(node tools/release/package-identities.mjs flutter "$VERSION")"
          ARCHIVE="target/flutter-release/public-${FLUTTER_PACKAGE}-$VERSION.tar.gz"
          URL="https://pub.dev/api/archives/${FLUTTER_PACKAGE}-$VERSION.tar.gz"
          HTTP_CODE="$(curl --silent --show-error --location --retry 3 \
            --output "$ARCHIVE" --write-out '%{http_code}' "$URL")"
          case "$HTTP_CODE" in
            200)
              node tools/flutter/verify-publication.mjs verify-public \
                --archive "$ARCHIVE" \
                --inventory target/flutter-release/package-inventory.json
              echo 'needs-publish=false' >> "$GITHUB_OUTPUT"
              ;;
            404)
              rm -f "$ARCHIVE"
              echo 'needs-publish=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "pub.dev archive lookup failed with HTTP $HTTP_CODE" >&2
              exit 1
              ;;
          esac

  publish:
    needs: gate
    if: needs.gate.outputs.needs-publish == 'true'
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: release
      working-directory: frameworks/flutter/bota_app_sdk
