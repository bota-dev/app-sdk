name: CocoaPods Specs

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional exact branch-head commit for index publication checks
        type: string
        required: false
        default: ''
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Validate Specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bind a requested revision to the actual workflow head
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          EVENT_REVISION: ${{ github.sha }}
        run: |
          if [[ -n "$REQUESTED_REVISION" ]]; then
            [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ && "$REQUESTED_REVISION" == "$EVENT_REVISION" ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate canonical metadata and immutable version history
        env:
          SPEC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          node --test tools/release/validate-owned-specs.test.mjs
          node tools/release/validate-owned-specs.mjs --base "$SPEC_BASE_SHA"
