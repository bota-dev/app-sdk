name: Qualify Bota CocoaPods Specs
run-name: Bota Specs clean Apple and Flutter consumers / ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact already-published SDK version to qualify through Bota Specs
        type: string
        required: true
        default: 2.0.0-beta.22

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  consumers:
    name: Clean owned-source Apple and Flutter installs
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SDK_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out exact qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate version and run source admission checks
        run: |
          node --input-type=module -e 'import {ownedSpecPath} from "./tools/release/owned-cocoapods.mjs"; console.log(ownedSpecPath(process.env.SDK_VERSION));'
          node --test tools/release/owned-cocoapods.test.mjs tools/flutter/verify-cocoapods-consumer.test.mjs
      - name: Install isolated CocoaPods toolchain
        run: tools/flutter/install-pinned-cocoapods.sh
      - name: Resolve and compile clean public Apple CocoaPod
        run: tools/flutter/test-public-apple-pod-consumer.sh "$SDK_VERSION"
      - name: Resolve and compile clean public Flutter CocoaPods consumer
        run: tools/flutter/test-public-cocoapods-consumer.sh "$SDK_VERSION"
